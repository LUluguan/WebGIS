<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 广东降雨洪涝 WebGIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0a1626 0%, #0d2540 55%, #123a5c 100%);
      display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .card { width: 380px; max-width: 92vw; background: rgba(13,25,43,0.92); color: #e6f1ff;
      border: 1px solid rgba(79,195,247,0.35); border-radius: 14px; padding: 34px 34px 26px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.55); }
    .card h1 { font-size: 20px; color: #4fc3f7; letter-spacing: 2px; text-align: center; margin-bottom: 4px; }
    .card .sub { font-size: 12px; color: #9fb3cc; text-align: center; margin-bottom: 26px; }
    .fld { margin-bottom: 16px; }
    .fld label { display: block; font-size: 12px; color: #9fb3cc; margin-bottom: 6px; }
    .fld input { width: 100%; padding: 11px 13px; border: 1px solid rgba(79,195,247,0.4);
      background: rgba(13,25,43,0.7); color: #e6f1ff; border-radius: 8px; font-size: 14px; }
    .fld input:focus { outline: none; border-color: #4fc3f7; box-shadow: 0 0 0 2px rgba(79,195,247,0.15); }
    #btn { width: 100%; padding: 12px; background: #0288d1; color: #fff; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: 4px; margin-top: 6px; }
    #btn:hover { background: #039be5; }
    #btn:disabled { opacity: 0.55; cursor: wait; }
    #err { color: #ff8a80; font-size: 12.5px; min-height: 18px; margin-top: 10px; text-align: center; }
    .demo { margin-top: 18px; padding-top: 14px; border-top: 1px dashed rgba(79,195,247,0.25);
      font-size: 11.5px; color: #6b8299; line-height: 1.8; }
    .demo b { color: #9fb3cc; }
    .quick { display: flex; gap: 8px; margin-top: 8px; }
    .quick div { flex: 1; text-align: center; padding: 7px 0; border: 1px solid rgba(79,195,247,0.35);
      border-radius: 7px; font-size: 12px; color: #cfe6ff; cursor: pointer; }
    .quick div:hover { background: rgba(79,195,247,0.15); }
    .back { text-align: center; margin-top: 16px; }
    .back a { color: #4fc3f7; font-size: 12.5px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔐 用户登录</h1>
    <div class="sub">广东降雨洪涝三维可视化系统 · C2132</div>
    <div class="fld">
      <label>用户名</label>
      <input id="username" autocomplete="username" placeholder="请输入用户名" />
    </div>
    <div class="fld">
      <label>密码</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
    </div>
    <button id="btn">登 录</button>
    <div id="err"></div>
    <div class="demo">
      <b>演示账号</b>(首次登录时自动创建)<br />
      管理员: admin / admin123(可核实公众报汛)<br />
      公众用户: public / 123456(报汛与查看)
      <div class="quick">
        <div onclick="fill('admin','admin123')">填入管理员</div>
        <div onclick="fill('public','123456')">填入公众</div>
      </div>
    </div>
    <div class="back"><a href="welcome.html">← 返回系统首页</a></div>
  </div>
  <script>
    function fill(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }
    function doLogin() {
      var u = document.getElementById('username').value.trim();
      var p = document.getElementById('password').value;
      var err = document.getElementById('err');
      if (!u || !p) { err.textContent = '请输入用户名与密码'; return; }
      var btn = document.getElementById('btn');
      btn.disabled = true; err.textContent = '';
      fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p }) }).then(function(r) { return r.json(); }).then(function(d) {
        btn.disabled = false;
        if (d.error) { err.textContent = '⚠ ' + d.error; return; }
        localStorage.setItem('flood_token', d.token);
        localStorage.setItem('flood_user', JSON.stringify({ username: d.username, role: d.role }));
        location.href = 'welcome.html';
      }).catch(function(e) { btn.disabled = false; err.textContent = '⚠ 请求失败: ' + ((e && e.message) || e); });
    }
    document.getElementById('btn').onclick = doLogin;
    document.getElementById('password').addEventListener('keydown', function(ev) { if (ev.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
