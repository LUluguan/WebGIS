<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>广东降雨洪涝三维可视化 · 珠江新城</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.95/Build/Cesium/Widgets/widgets.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #cesiumContainer { width: 100%; height: 100%; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; }
    #panel {
      position: absolute; top: 16px; left: 16px; width: 300px;
      background: rgba(13,25,43,0.92); color: #e6f1ff; border: 1px solid rgba(79,195,247,0.35);
      border-radius: 12px; padding: 18px; z-index: 999; box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }
    #panel h1 { font-size: 17px; font-weight: 700; color: #4fc3f7; letter-spacing: 1px; margin-bottom: 4px; }
    #panel .sub { font-size: 12px; color: #9fb3cc; margin-bottom: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .btn { flex: 1 1 18%; padding: 8px 4px; border: 1px solid rgba(79,195,247,0.4);
      background: rgba(79,195,247,0.08); color: #cfe6ff; border-radius: 8px; cursor: pointer;
      font-size: 13px; font-weight: 600; text-align: center; transition: all .15s; }
    .btn:hover { background: rgba(79,195,247,0.2); }
    .btn.active { background: #0288d1; color: #fff; border-color: #4fc3f7; box-shadow: 0 0 12px rgba(79,195,247,0.5); }
    .stats { background: rgba(255,255,255,0.04); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .stat { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed rgba(255,255,255,0.08); }
    .stat:last-child { border-bottom: none; }
    .stat .k { color: #9fb3cc; } .stat .v { color: #4fc3f7; font-weight: 600; font-variant-numeric: tabular-nums; }
    .toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cfe6ff; margin-top: 12px; cursor: pointer; }
    .linkbar { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(79,195,247,0.2); }
    .linkbar a { color: #4fc3f7; text-decoration: none; font-size: 13px; }
    .linkbar a:hover { text-decoration: underline; }
    .note { font-size: 11px; color: #6b8299; margin-top: 10px; line-height: 1.5; }
    #status { position: absolute; bottom: 16px; left: 16px; color: #4fc3f7; font-size: 12px; z-index: 999; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <div id="panel">
    <h1>三维城市降雨洪涝可视化</h1>
    <div class="sub">广州市 · 珠江新城 / 广州塔 · 重现期情景模拟</div>
    <div class="row" id="btns"></div>
    <div class="stats" id="stats"></div>
    <label class="toggle"><input type="checkbox" id="depthToggle" checked /> 显示水深色带图</label>
    <div class="linkbar"><a href="dashboard.html">📊 数据大屏</a> &nbsp;·&nbsp; <a href="unet.html">🧠 UNet 水体提取</a> &nbsp;·&nbsp; <a href="realevent.html">🌊 真实事件 · UNet 反演水深</a></div>
    <div class="note">方法:Gumbel 重现期拟合 → 径流深 → 浴缸法反演水位 → 水深=水位−地形。数据由服务层 API(PostGIS)提供。仅供演示。</div>
  </div>
  <div id="status">正在连接服务层 API...</div>

  <script src="https://cdn.jsdelivr.net/npm/cesium@1.95/Build/Cesium/Cesium.js"></script>
  <script src="buildings_3d.js"></script>
  <script>
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIwNzU0ZmRjNi0yZTFkLTQ3NGQtOGUzYS1kNTgwOTRiMTM2YzgiLCJpZCI6NDA1NTMxLCJzdWIiOiJMZGlMY2tLIiwiaXNzIjoiaHR0cHM6Ly9hcGkuY2VzaXVtLmNvbSIsImF1ZCI6IldlYmdpcyIsImlhdCI6MTc4MzM0MTUzMH0.FD9U2vSiB15hIW2refmhxHojVMhYZre1_D0UJiq3JKo';
    var TDT_KEY = '7fdf880a2ea2d36020311024b65d3e2d';

    var viewer = new Cesium.Viewer('cesiumContainer', {
      baseLayerPicker: false, animation: false, timeline: false, geocoder: false,
      homeButton: false, infoBox: false, sceneModePicker: false,
      navigationHelpButton: false, fullscreenButton: true
    });

    viewer.imageryLayers.addImageryProvider(new Cesium.WebMapTileServiceImageryProvider({
      url: 'https://{s}.tianditu.gov.cn/img_w/wmts?service=wmts&request=GetTile&version=1.0.0'
         + '&LAYER=img&tileMatrixSet=w&TileMatrix={TileMatrix}&TileRow={TileRow}&TileCol={TileCol}'
         + '&style=default&format=tiles&tk=' + TDT_KEY,
      layer: 'img', style: 'default', format: 'tiles', tileMatrixSetID: 'w',
      subdomains: ['t0','t1','t2','t3','t4','t5','t6','t7'], maximumLevel: 18,
      credit: new Cesium.Credit('天地图影像')
    }));
    viewer.imageryLayers.addImageryProvider(new Cesium.WebMapTileServiceImageryProvider({
      url: 'https://{s}.tianditu.gov.cn/cia_w/wmts?service=wmts&request=GetTile&version=1.0.0'
         + '&LAYER=cia&tileMatrixSet=w&TileMatrix={TileMatrix}&TileRow={TileRow}&TileCol={TileCol}'
         + '&style=default&format=tiles&tk=' + TDT_KEY,
      layer: 'cia', style: 'default', format: 'tiles', tileMatrixSetID: 'w',
      subdomains: ['t0','t1','t2','t3','t4','t5','t6','t7'], maximumLevel: 18
    }));

    var B = { west: 113.30, south: 23.09, east: 113.34, north: 23.13 };
    var RECT = Cesium.Rectangle.fromDegrees(B.west, B.south, B.east, B.north);

    // 建筑(静态几何)
    function colorByHeight(h) {
      if (h >= 150) return '#ffb300';
      var t = Math.min(h / 150, 1);
      return 'rgb(' + Math.round(120 - 20 * t) + ',' + Math.round(160 - 60 * t) + ',' + Math.round(190 - 40 * t) + ')';
    }
    BUILDINGS_3D.forEach(function(b) {
      if (b.name === '广州塔') return;   // 广州塔用下方专属模型
      var pos = []; b.ring.forEach(function(p) { pos.push(p[0], p[1]); });
      viewer.entities.add({
        polygon: {
          hierarchy: Cesium.Cartesian3.fromDegreesArray(pos),
          height: b.g || 0, extrudedHeight: (b.g || 0) + (b.h || 5),
          material: Cesium.Color.fromCssColorString(colorByHeight(b.h || 5)).withAlpha(0.9),
          outline: true, outlineColor: Cesium.Color.WHITE.withAlpha(0.3)
        }
      });
    });

    // ===== 广州塔(双曲面"小蛮腰" + 天线)专属建模 =====
    function createCantonTower() {
      var lon = 113.3192, lat = 23.1090, base = 9.0;
      var bodyH = 454, antennaH = 146;
      // 半径剖面(二次曲线): 底部40m -> 腰部(0.35处)20m -> 顶部34m
      function bodyR(z) { return 40 - 84.6813 * z + 78.6813 * z * z; }
      var color = Cesium.Color.fromCssColorString('#b0b8c0');

      // 用堆叠圆柱(实体 cylinder)近似双曲面"小蛮腰" —— 保证渲染
      var segs = [];
      var N = 22;
      for (var i = 0; i < N; i++) {
        var z0 = i / N, z1 = (i + 1) / N;
        segs.push([base + z0 * bodyH, base + z1 * bodyH, bodyR(z0), bodyR(z1)]);
      }
      for (var j = 0; j < 4; j++) {   // 天线 454~600m 收细
        var za0 = j / 4, za1 = (j + 1) / 4;
        segs.push([base + bodyH + za0 * antennaH, base + bodyH + za1 * antennaH,
                   2.5 - 1.5 * za0, 2.5 - 1.5 * za1]);
      }

      segs.forEach(function(s) {
        viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(lon, lat, (s[0] + s[1]) / 2),
          cylinder: {
            length: s[1] - s[0],
            topRadius: s[3],
            bottomRadius: s[2],
            material: color,
            outline: false
          }
        });
      });
    }
    try { createCantonTower(); } catch (e) { console.error('广州塔建模失败:', e); }

    var depthLayer = null;
    function setDepthLayer(T) {
      if (depthLayer) { viewer.imageryLayers.remove(depthLayer, true); depthLayer = null; }
      if (!document.getElementById('depthToggle').checked) return;
      depthLayer = viewer.imageryLayers.addImageryProvider(new Cesium.SingleTileImageryProvider({
        url: '/api/flood_depth_png?return_period=' + T, rectangle: RECT
      }));
      depthLayer.alpha = 0.72;
    }

    var waterEntities = [];
    function setWater(T, s) {
      waterEntities.forEach(function(e) { viewer.entities.remove(e); });
      waterEntities = [];
      fetch('/api/flood_extent?return_period=' + T).then(function(r) { return r.json(); }).then(function(fc) {
        (fc.features || []).forEach(function(f) {
          var ring = f.geometry.coordinates[0];
          var pos = []; ring.forEach(function(p) { pos.push(p[0], p[1]); });
          waterEntities.push(viewer.entities.add({
            polygon: {
              hierarchy: Cesium.Cartesian3.fromDegreesArray(pos),
              height: 0, extrudedHeight: s.water_level_m,
              material: Cesium.Color.fromCssColorString('#2196f3').withAlpha(0.5)
            }
          }));
        });
        document.getElementById('status').innerHTML = '已从 API 加载 ' + fc.features.length + ' 个淹没斑块';
      });
    }

    function renderStats(s) {
      document.getElementById('stats').innerHTML =
        '<div class="stat"><span class="k">重现期</span><span class="v">' + s.return_period_y + ' 年一遇</span></div>' +
        '<div class="stat"><span class="k">设计雨量</span><span class="v">' + s.rain_mm + ' mm</span></div>' +
        '<div class="stat"><span class="k">反演水位</span><span class="v">' + s.water_level_m + ' m</span></div>' +
        '<div class="stat"><span class="k">淹没面积</span><span class="v">' + s.flooded_area_km2 + ' km²</span></div>' +
        '<div class="stat"><span class="k">平均水深</span><span class="v">' + s.mean_depth_m + ' m</span></div>' +
        '<div class="stat"><span class="k">最大水深</span><span class="v">' + s.max_depth_m + ' m</span></div>';
    }

    var curBtn = null;
    function select(T) {
      var s = SCENARIOS.find(function(x) { return x.return_period_y === T; });
      renderStats(s); setWater(T, s); setDepthLayer(T);
    }

    var SCENARIOS = [];
    fetch('/api/scenarios').then(function(r) { return r.json(); }).then(function(data) {
      SCENARIOS = data;
      var btns = document.getElementById('btns');
      data.forEach(function(s) {
        var b = document.createElement('div');
        b.className = 'btn'; b.textContent = s.return_period_y + '年';
        b.onclick = function() {
          if (curBtn) curBtn.classList.remove('active');
          b.classList.add('active'); curBtn = b; select(s.return_period_y);
        };
        btns.appendChild(b);
      });
      var last = data[data.length - 1];
      document.getElementById('status').innerHTML = '已从 API 加载 ' + data.length + ' 个重现期场景';
      select(last.return_period_y);
      btns.children[data.length - 1].classList.add('active'); curBtn = btns.children[data.length - 1];
    });

    document.getElementById('depthToggle').onchange = function() {
      if (SCENARIOS.length) setDepthLayer(SCENARIOS[SCENARIOS.length - 1].return_period_y);
    };

    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(113.3220, 23.1085, 7200),
      orientation: { heading: Cesium.Math.toRadians(-22), pitch: Cesium.Math.toRadians(-42), roll: 0 }
    });
  </script>
</body>
</html>
